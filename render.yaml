# Render Blueprint: "New + > Blueprint" and pick this repo. Free plan, built from the Dockerfile.
services:
  - type: web
    name: eum-logistics-game
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: CLASS_PIN
        sync: false          # you type it in the Render dashboard
      - key: ADMIN_PASSWORD
        sync: false
